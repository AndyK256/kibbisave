name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore stable debug signing certificate
        env:
          DEBUG_KEYSTORE: ${{ secrets.KIBBISAVE_DEBUG_KEYSTORE }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          payload = os.environ.get('DEBUG_KEYSTORE')
          if not payload:
              raise SystemExit('KIBBISAVE_DEBUG_KEYSTORE is required for registered Google sign-in builds')
          target = Path.home() / '.android' / 'debug.keystore'
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(base64.b64decode(payload, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'KIBBISAVE_DEBUG_KEYSTORE_PATH={target}\n')
          PYTHON
      - name: Test, build and lint native Kotlin apps
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_kibbisaveApiUrl: ${{ vars.KIBBISAVE_API_URL || 'https://kibbisave.com' }}
          ORG_GRADLE_PROJECT_kibbisaveAdminApiUrl: ${{ vars.KIBBISAVE_ADMIN_API_URL || 'https://kibbisave.com' }}
        run: gradle --no-daemon :app:testUserDebugUnitTest :app:testAdminDebugUnitTest :app:assembleUserDebug :app:assembleAdminDebug :app:lintUserDebug :app:lintAdminDebug :app:bundleUserRelease :app:bundleAdminRelease
      - name: Verify registered Google sign-in certificate
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          signer = sdk / 'build-tools' / '35.0.0' / 'apksigner'
          expected = '778574b6a13fad07dce757ebe5e1f9355eda54cb'
          for audience in ('user', 'admin'):
              apk = f'android/app/build/outputs/apk/{audience}/debug/app-{audience}-debug.apk'
              result = subprocess.run([str(signer), 'verify', '--print-certs', apk], check=True, capture_output=True, text=True)
              digest = next(line.split(': ', 1)[1].strip() for line in result.stdout.splitlines() if 'certificate SHA-1 digest:' in line)
              if digest.lower() != expected:
                  raise SystemExit(f'{audience} APK certificate does not match Google Cloud registration')
              print(f'{audience}: registered signing certificate verified')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: kibbisave-user-native-apk
          path: android/app/build/outputs/apk/user/debug/app-user-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kibbisave-admin-native-apk
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-and-lint-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: kibbisave-user-unsigned-release-bundle
          path: android/app/build/outputs/bundle/userRelease/app-user-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kibbisave-admin-unsigned-release-bundle
          path: android/app/build/outputs/bundle/adminRelease/app-admin-release.aab
          if-no-files-found: error
