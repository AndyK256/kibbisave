<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kibbi Admin</title>
  <link rel="icon" href="/assets/kibbisave.jpg" type="image/jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/admin/css/kibbi-admin.css">
</head>
<body>
  <div class="ka-app" id="ka-app">
    <div class="ka-scroll" id="ka-scroll"></div>

    <nav class="ka-dock" id="ka-dock">
      <button type="button" data-go="profile" id="nav-profile">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Profile
      </button>
      <button type="button" data-go="communities" id="nav-communities">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 18c.8-2.4 2.4-3.6 4.5-3.6s3.7 1.2 4.5 3.6M12.5 18c.5-1.6 1.6-2.6 3.3-2.6 1.8 0 3.1 1.1 3.7 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Communities
      </button>
      <button type="button" class="ka-fab" data-go="home" id="nav-home" aria-label="Kibbi Home">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-go="approvals" id="nav-approvals">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4.5 6.5v5.2c0 4.4 3.1 7.6 7.5 9.3 4.4-1.7 7.5-4.9 7.5-9.3V6.5L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.8 12.2 2.2 2.2 4.2-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Approvals <span class="ka-badge" id="nav-badge" hidden>0</span>
      </button>
      <button type="button" data-go="register" id="nav-register">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 19c1.2-3 3.3-4.5 5.5-4.5 1.1 0 2.1.3 3 .9M17 11v6M14 14h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Register
      </button>
    </nav>

    <div class="ka-sheet" id="ka-pin-sheet" hidden aria-hidden="true">
      <div class="ka-sheet-card">
        <h2 style="color:var(--kb-primary);font-size:1.1rem;">Enter approval PIN</h2>
        <p class="ka-muted" style="margin-top:4px;">This PIN credits the member’s savings on KibbiSave.</p>
        <div class="ka-pins">
          <input inputmode="numeric" maxlength="1" data-pin="0" autocomplete="off">
          <input inputmode="numeric" maxlength="1" data-pin="1" autocomplete="off">
          <input inputmode="numeric" maxlength="1" data-pin="2" autocomplete="off">
          <input inputmode="numeric" maxlength="1" data-pin="3" autocomplete="off">
        </div>
        <div class="ka-error" id="pin-error"></div>
        <button type="button" class="ka-cta" id="pin-confirm">Approve</button>
        <button type="button" class="ka-link" id="pin-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/admin/js/kibbi-admin.js"></script>
</body>
</html>
